services:
  database:
    image: postgres:15-alpine
    container_name: pwa_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile.prod
    container_name: pwa_backend_core
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - IA_SERVICE_URL=http://ia-service:8000
      - IA_SERVICE_TOKEN=${IA_SERVICE_TOKEN}
      - KYR_PROXY_TOKEN=${KYR_PROXY_TOKEN}
      - KYR_PROXIES_CONFIAVEIS=${KYR_PROXIES_CONFIAVEIS:-0}
      - ROTEIRO_LIMITE_POR_IP_POR_HORA=${ROTEIRO_LIMITE_POR_IP_POR_HORA:-10}
      - ROTEIRO_LIMITE_POR_DIA=${ROTEIRO_LIMITE_POR_DIA:-30}
    depends_on:
      database:
        condition: service_healthy

  ia-service:
    build:
      context: ./ia-service
      dockerfile: Dockerfile.prod
    container_name: pwa_ia_service
    restart: always
    # Sem "ports": o ia-service só é alcançado pelo backend-core, pela rede interna do Compose.
    # Publicar a porta deixaria qualquer um chamar os provedores de LLM pagos.
    expose:
      - "8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-15}
      - IA_SERVICE_TOKEN=${IA_SERVICE_TOKEN}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        - NEXT_PUBLIC_CONTATO_PRIVACIDADE=${NEXT_PUBLIC_CONTATO_PRIVACIDADE:-}
    container_name: pwa_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_API_URL=http://backend-core:8080
      - KYR_PROXY_TOKEN=${KYR_PROXY_TOKEN}
      - KYR_PROXIES_CONFIAVEIS=${KYR_PROXIES_CONFIAVEIS:-0}
    depends_on:
      - backend-core

volumes:
  postgres_data:
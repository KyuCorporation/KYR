openapi: 3.0.3
info:
  title: KYU - API de Roteirização Turística
  description: >
    Contrato de API do backend-core (geração de roteiros, contas, roteiros salvos e
    avaliações) e do contrato interno entre o backend-core e o ia-service
    (POST /curar-roteiro). A geração de
    roteiros combina dados de geolocalização com curadoria
    via IA.
  version: 1.4.0

servers:
  - url: http://localhost:8080
    description: Ambiente local
  - url: https://kyr-backend-hkq1.onrender.com
    description: Ambiente de produção

paths:
  /roteiros:
    post:
      summary: Gera um roteiro turístico entre origem e destino
      description: >
        Recebe uma origem e um destino quaisquer, busca pontos de interesse (POIs) no
        Google Places ao longo da rota entre os dois, mantém os mais bem avaliados
        (até 10 por padrão), envia-os à curadoria por IA (ia-service) e ordena o
        resultado com a Google Directions API.

        Degradação: se a curadoria falhar ou demorar demais, a resposta é 200 com os
        POIs sem curadoria (`curado` falso, `metadados.curadoPorIa` falso e
        `metadados.fonteIA` igual a `sem-curadoria`). Se a ordenação falhar, a resposta
        é 200 com os POIs na ordem da seleção, sem distância nem duração
        (`metadados.fonteRota` igual a `fallback-sem-otimizacao`). Se o Google Places
        ou a busca da rota falharem, a resposta é 502. Se nenhum POI for encontrado,
        a resposta é 200 com `pontos` vazio.

        A curadoria de cada lugar fica guardada por 30 dias, indexada pelo ID do lugar; lugares já
        curados não voltam ao ia-service. Nesse caso `metadados.fonteIA` traz o modelo que fez a
        curadoria guardada.

        O roteiro gerado não é persistido por este endpoint (ver `/roteiros-salvos`).

        Limite de uso (cada roteiro consulta APIs pagas do Google e um provedor de LLM): por
        padrão, 10 roteiros por IP por hora e 30 por dia no serviço inteiro
        (`ROTEIRO_LIMITE_POR_IP_POR_HORA` e `ROTEIRO_LIMITE_POR_DIA`). O `GET /api/v1/rotas/pois`
        entra no mesmo limite.
      operationId: gerarRoteiro
      tags:
        - Roteiros
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoteiroRequest'
            example:
              origem:
                nome: "Aeroporto Internacional de Foz do Iguaçu"
                latitude: -25.6003
                longitude: -54.4854
              destino:
                nome: "Local do evento"
                latitude: -25.5478
                longitude: -54.5882
      responses:
        '200':
          description: Roteiro gerado (com ou sem curadoria, com ou sem ordenação otimizada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoteiroResponse'
        '400':
          description: >
            Corpo inválido (`dados_invalidos`): origem ou destino ausentes; `nome`, `latitude`
            ou `longitude` ausentes, mal formatados ou fora do intervalo; mais de 8 paradas;
            ou meio de transporte desconhecido. Um pedido inválido não conta para o limite de uso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                codigo: "dados_invalidos"
                mensagem: "um roteiro tem no máximo 8 paradas"
        '429':
          $ref: '#/components/responses/MuitasTentativas'
        '502':
          description: >
            Falha na integração com o Google Maps (Places ou busca da rota), inclusive
            quando a chave `GOOGLE_MAPS_API_KEY` não está configurada. A mensagem nunca
            contém a chave da API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                codigo: "erro_integracao_google_maps"
                mensagem: "Falha de comunicação com a Places API (Forbidden)"

  /auth/cadastro:
    post:
      summary: Cria uma conta e abre uma sessão
      tags: [Conta]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroRequest'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoResponse'
        '400':
          description: >
            Dados inválidos (nome vazio, e-mail inválido, senha fora de 8 a 72 caracteres ou
            com mais de 72 bytes em UTF-8, limite do bcrypt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '409':
          description: Já existe uma conta com esse e-mail (`email_ja_cadastrado`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '429':
          $ref: '#/components/responses/MuitasTentativas'

  /auth/login:
    post:
      summary: Abre uma sessão com e-mail e senha
      tags: [Conta]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email }
                senha: { type: string }
      responses:
        '200':
          description: Sessão aberta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoResponse'
        '401':
          description: E-mail ou senha incorretos (`credenciais_invalidas`). A mensagem é a mesma nos dois casos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '429':
          $ref: '#/components/responses/MuitasTentativas'

  /auth/eu:
    get:
      summary: Devolve o usuário dono da sessão
      tags: [Conta]
      security: [{ sessao: [] }]
      responses:
        '200':
          description: Usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    put:
      summary: Corrige o nome da conta (LGPD, art. 18, III)
      tags: [Conta]
      security: [{ sessao: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Usuário com o nome corrigido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Nome vazio ou longo demais (`dados_invalidos`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /auth/meus-dados:
    get:
      summary: Exporta tudo o que o servidor guarda sobre a conta (LGPD, acesso e portabilidade)
      description: >
        Devolve um JSON com a conta (nome, e-mail, data de criação), os roteiros salvos, as
        avaliações e a validade das sessões ativas, como anexo (`Content-Disposition`) e com
        `Cache-Control: no-store`. A senha não aparece (só existe o hash).
      tags: [Conta]
      security: [{ sessao: [] }]
      responses:
        '200':
          description: Dados da conta
          content:
            application/json:
              schema:
                type: object
                properties:
                  geradoEm: { type: string, format: date-time }
                  conta:
                    type: object
                    properties:
                      nome: { type: string }
                      email: { type: string }
                      criadaEm: { type: string, format: date-time }
                  roteirosSalvos:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoteiroSalvo'
                  avaliacoes:
                    type: array
                    items:
                      type: object
                      properties:
                        destino: { type: string }
                        nota: { type: integer }
                        comentario: { type: string }
                        criadaEm: { type: string, format: date-time }
                  sessoesAtivasValidasAte:
                    type: array
                    items: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /auth/conta:
    delete:
      summary: Exclui a conta (LGPD, eliminação)
      description: >
        Exige a senha, além da sessão. Apaga em cascata as sessões, os roteiros salvos e as
        avaliações. A conferência da senha entra no mesmo limite de tentativas do login.
      tags: [Conta]
      security: [{ sessao: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senha]
              properties:
                senha: { type: string }
      responses:
        '204':
          description: Conta excluída
        '400':
          description: Senha não informada (`dados_invalidos`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Senha incorreta (`senha_incorreta`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '429':
          $ref: '#/components/responses/MuitasTentativas'

  /auth/sair:
    post:
      summary: Encerra a sessão
      tags: [Conta]
      security: [{ sessao: [] }]
      responses:
        '204':
          description: Sessão encerrada (também quando o token não existe mais)

  /roteiros-salvos:
    get:
      summary: Lista os roteiros salvos na conta
      tags: [Roteiros salvos]
      security: [{ sessao: [] }]
      responses:
        '200':
          description: Até 100 roteiros, do mais recente para o mais antigo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoteiroSalvo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      summary: Salva um roteiro na conta
      description: >
        Guarda a origem e o destino escolhidos e os IDs dos lugares sugeridos. Nomes, endereços e
        notas dos lugares do Google não são gravados (termos da Places API). Para rever os lugares,
        o cliente gera o roteiro de novo com a mesma origem e o mesmo destino.
      tags: [Roteiros salvos]
      security: [{ sessao: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origem, destino]
              properties:
                origem:
                  $ref: '#/components/schemas/Ponto'
                destino:
                  $ref: '#/components/schemas/Ponto'
                placeIds:
                  type: array
                  maxItems: 25
                  items: { type: string }
      responses:
        '201':
          description: Roteiro salvo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoteiroSalvo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /roteiros-salvos/{id}:
    delete:
      summary: Remove um roteiro salvo da conta
      tags: [Roteiros salvos]
      security: [{ sessao: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Removido
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Roteiro inexistente ou de outra conta (`roteiro_nao_encontrado`)

  /destinos/{slug}/avaliacoes:
    parameters:
      - name: slug
        in: path
        required: true
        description: Identificador do destino no catálogo do Kyr (por exemplo, `parque-das-aves`)
        schema: { type: string, pattern: '^[a-z0-9-]{1,120}$' }
    get:
      summary: Lista as avaliações de um destino do catálogo do Kyr
      description: Avaliações escritas por usuários do Kyr. Não são avaliações do Google Maps. Não exige login.
      tags: [Avaliações]
      responses:
        '200':
          description: Média, total e as 50 avaliações mais recentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Avaliacoes'
    put:
      summary: Cria ou substitui a avaliação do usuário para o destino
      tags: [Avaliações]
      security: [{ sessao: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nota]
              properties:
                nota: { type: integer, minimum: 1, maximum: 5 }
                comentario: { type: string, maxLength: 600 }
      responses:
        '200':
          description: Avaliações do destino já com a nova
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Avaliacoes'
        '400':
          description: Nota fora de 1 a 5 ou comentário longo demais
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /curar-roteiro:
    servers:
      - url: http://localhost:8000
        description: ia-service (chamado só pelo backend-core; em produção, sem porta pública)
    post:
      summary: Classifica e descreve POIs com a cadeia de provedores de LLM (ia-service)
      description: >
        Contrato interno entre o backend-core e o ia-service. Este serviço usa snake_case no JSON.
        Para cada POI, devolve `trilha` (`turismo` ou `compras`), `tipo` (`alimentacao` ou `lazer`)
        e uma descrição em português; o prompt pede até 300 caracteres, mas o limite não é imposto
        pelo serviço. Os pontos voltam na mesma ordem do pedido. Se nenhum provedor responder no
        tempo total da cadeia (`LLM_ORCAMENTO_TOTAL_SECONDS`, padrão 35 s), a resposta é 200 com
        `curado_por_ia` falso e os pontos sem classificação.

        Com `IA_SERVICE_TOKEN` definido, exige o mesmo valor no cabeçalho `X-Kyr-Token`.
      operationId: curarRoteiro
      tags: [IA]
      parameters:
        - in: header
          name: X-Kyr-Token
          required: false
          schema: { type: string }
          description: Segredo compartilhado com o backend-core. Obrigatório quando o serviço tem um configurado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pontos]
              properties:
                pontos:
                  type: array
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/PontoBruto'
            example:
              pontos:
                - nome: "Parque das Aves"
                  categoria: "tourist_attraction"
                  coordenadas: [-25.6396, -54.4353]
      responses:
        '200':
          description: POIs curados ou, individualmente, sem curadoria
          content:
            application/json:
              schema:
                type: object
                properties:
                  pontos:
                    type: array
                    items:
                      $ref: '#/components/schemas/PontoCurado'
                  curado_por_ia:
                    type: boolean
                    description: true quando algum provedor da cadeia respondeu.
                  modelo_utilizado:
                    type: string
                    nullable: true
                    description: Modelo que respondeu, ou nulo.
        '400':
          description: Corpo inválido (lista ausente, mais de 50 pontos, nome ou categoria vazios, coordenadas sem 2 valores)
        '401':
          description: Token do backend ausente ou inválido (`nao_autorizado`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

components:
  securitySchemes:
    sessao:
      type: http
      scheme: bearer
      description: >
        Token devolvido por `/auth/cadastro` e `/auth/login`, válido por 30 dias. No frontend ele fica
        em um cookie httpOnly e é repassado pelas rotas `/api/*` do Next.
  responses:
    NaoAutenticado:
      description: Sem token, token inválido ou sessão vencida (`nao_autenticado`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
    MuitasTentativas:
      description: >
        Limite de uso atingido (`muitas_tentativas`). O cabeçalho `Retry-After` traz, em segundos,
        quanto falta para a janela acabar. Login: 5 senhas erradas por e-mail e 30 por IP a cada
        15 min; cadastro: 10 por IP por hora; roteiros: ver `POST /roteiros`.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Segundos até a próxima tentativa ser aceita.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
          example:
            codigo: "muitas_tentativas"
            mensagem: "Muitas tentativas. Tente de novo em 15 minutos."
  schemas:
    CadastroRequest:
      type: object
      required: [nome, email, senha]
      properties:
        nome: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        senha: { type: string, minLength: 8, maxLength: 72 }

    Usuario:
      type: object
      required: [nome, email]
      properties:
        nome: { type: string }
        email: { type: string, format: email }

    SessaoResponse:
      type: object
      required: [token, usuario]
      properties:
        token:
          type: string
          description: Token da sessão. Só aparece nesta resposta; o banco guarda apenas o SHA-256 dele.
        usuario:
          $ref: '#/components/schemas/Usuario'

    LocalSalvo:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          description: >
            Vazio depois de 30 dias: o nome costuma vir das sugestões do Google e é apagado junto com
            as coordenadas.
        latitude:
          type: number
          format: double
          nullable: true
          description: Nula depois de 30 dias (limite dos termos do Google para guardar coordenadas).
        longitude: { type: number, format: double, nullable: true }

    RoteiroSalvo:
      type: object
      required: [id, origem, destino, totalPontos, placeIds, criadoEm, podeReabrir]
      properties:
        id: { type: integer, format: int64 }
        origem:
          $ref: '#/components/schemas/LocalSalvo'
        destino:
          $ref: '#/components/schemas/LocalSalvo'
        totalPontos: { type: integer }
        placeIds:
          type: array
          items: { type: string }
        criadoEm: { type: string, format: date-time }
        podeReabrir:
          type: boolean
          description: Falso quando as coordenadas já foram apagadas.

    Avaliacoes:
      type: object
      required: [total, avaliacoes]
      properties:
        media: { type: number, format: double, nullable: true }
        total: { type: integer }
        avaliacoes:
          type: array
          items:
            type: object
            required: [autor, nota, comentario, criadoEm]
            properties:
              autor:
                type: string
                description: Primeiro nome de quem avaliou.
              nota: { type: integer, minimum: 1, maximum: 5 }
              comentario: { type: string }
              criadoEm: { type: string, format: date-time }

    Ponto:
      type: object
      required:
        - nome
        - latitude
        - longitude
      properties:
        nome:
          type: string
          example: "Aeroporto Internacional de Foz do Iguaçu"
        latitude:
          type: number
          format: double
          example: -25.6003
        longitude:
          type: number
          format: double
          example: -54.4854

    RoteiroRequest:
      type: object
      required:
        - origem
        - destino
      properties:
        origem:
          $ref: '#/components/schemas/Ponto'
        destino:
          $ref: '#/components/schemas/Ponto'
        paradas:
          type: array
          maxItems: 8
          description: >
            Paradas escolhidas pela pessoa. Os lugares são buscados ao longo da rota que passa por
            elas, na ordem informada. Na resposta, elas voltam como pontos com `parada` verdadeiro e
            entram na ordenação junto com os lugares sugeridos, então a ordem final pode mudar.
            Não passam pela curadoria.
          items:
            $ref: '#/components/schemas/Ponto'
        transporte:
          type: string
          default: DRIVING
          description: >
            Meio de transporte das distâncias e tempos. Em TRANSIT a Directions não aceita pontos
            intermediários: os lugares são buscados pela rota de carro e a ordenação cai no fallback.
          enum: [DRIVING, WALKING, BICYCLING, TRANSIT]

    POI:
      type: object
      required:
        - nome
        - latitude
        - longitude
        - curado
      properties:
        nome:
          type: string
          example: "Cataratas do Iguaçu (Parque Nacional do Iguaçu)"
        trilha:
          type: string
          nullable: true
          description: Trilha de classificação do POI, definida pela curadoria via IA. Nula quando `curado` é falso.
          enum:
            - turismo
            - compras
          example: turismo
        tipo:
          type: string
          nullable: true
          description: Tipo de classificação do POI, definido pela curadoria via IA. Nulo quando `curado` é falso.
          enum:
            - alimentacao
            - lazer
          example: lazer
        endereco:
          type: string
          nullable: true
          description: Endereço formatado devolvido pelo Google Places.
          example: "Bus Terminus - Rod, BR-469 - Km 18, Foz do Iguaçu - PR, 85853-830"
        latitude:
          type: number
          format: double
          example: -25.6953
        longitude:
          type: number
          format: double
          example: -54.4367
        fonte:
          type: string
          nullable: true
          description: Link do lugar no Google Maps, para rastreabilidade.
          example: "https://maps.google.com/?cid=1234567890"
        descricao:
          type: string
          nullable: true
          description: >
            Descrição curta gerada pela curadoria via IA. Nula quando `curado` é falso.
            Limite de 300 caracteres combinado com o frontend — reforçado via instrução
            ao LLM, sem truncamento rígido no backend, então consumidores devem tratar
            defensivamente descrições eventualmente maiores.
          maxLength: 300
          example: "Principal atração da região e Patrimônio Natural da Humanidade, abriga as famosas quedas d'água."
        curado:
          type: boolean
          description: >
            Indica se este POI específico foi curado com sucesso pela IA. Quando false,
            trilha/tipo/descricao são nulos.
          example: true
        placeId:
          type: string
          nullable: true
          description: >
            ID do lugar no Google Maps. É o único dado do lugar que o cliente pode guardar sem prazo;
            nome, endereço e demais campos não devem ser armazenados.
          example: "ChIJN1t_tDeuEmsRUsoyG83frY4"
        parada:
          type: boolean
          description: >
            Verdadeiro quando o ponto é uma parada informada em `paradas`, e não um lugar sugerido.
            Paradas vêm com `curado` falso e sem `placeId`, `endereco` e `fonte`.
          example: false
        distanciaMetros:
          type: integer
          format: int64
          nullable: true
          description: >
            Distância, em metros, do trecho que chega a este POI (a partir da origem ou
            do POI anterior). Nula quando a ordenação caiu no fallback.
          example: 12500
        duracaoSegundos:
          type: integer
          format: int64
          nullable: true
          description: >
            Duração, em segundos, do trecho que chega a este POI. Nula quando a
            ordenação caiu no fallback.
          example: 900

    RoteiroResponse:
      type: object
      required:
        - pontos
        - metadados
      properties:
        pontos:
          type: array
          items:
            $ref: '#/components/schemas/POI'
        metadados:
          type: object
          required:
            - totalPontos
            - tempoRespostaMs
            - fonteIA
            - curadoPorIa
            - fonteRota
          properties:
            totalPontos:
              type: integer
              description: Quantidade de itens em `pontos`.
              example: 10
            tempoRespostaMs:
              type: integer
              format: int64
              description: Tempo total de processamento da requisição, em milissegundos
              example: 1240
            fonteIA:
              type: string
              description: >
                Modelo de LLM que fez a curadoria (por exemplo, `gemini-2.5-flash`), ou
                `sem-curadoria` quando a curadoria não aconteceu.
              example: "gemini-2.5-flash"
            curadoPorIa:
              type: boolean
              description: Indica se o ia-service curou o roteiro.
              example: true
            fonteRota:
              type: string
              description: Fonte da ordenação dos POIs.
              enum:
                - google-directions-api
                - fallback-sem-otimizacao
              example: "google-directions-api"
            transporte:
              type: string
              description: Meio de transporte usado nas distâncias e tempos.
              enum: [DRIVING, WALKING, BICYCLING, TRANSIT]
              example: "DRIVING"
            distanciaTotalMetros:
              type: integer
              format: int64
              nullable: true
              description: >
                Soma de todos os trechos da rota ordenada, da origem ao destino. Inclui o trecho do
                último ponto até o destino, que não aparece em nenhum ponto. Nulo sem ordenação.
              example: 22850
            duracaoTotalSegundos:
              type: integer
              format: int64
              nullable: true
              description: Mesma soma, para a duração. Nulo sem ordenação.
              example: 1980

    PontoBruto:
      type: object
      required: [nome, categoria, coordenadas]
      properties:
        nome: { type: string, maxLength: 300 }
        categoria: { type: string, maxLength: 100, description: Tipo principal do lugar no Google. }
        coordenadas:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
          description: "[latitude, longitude]"

    PontoCurado:
      type: object
      properties:
        nome: { type: string }
        categoria: { type: string }
        coordenadas:
          type: array
          items: { type: number }
        trilha: { type: string, nullable: true, enum: [turismo, compras] }
        tipo: { type: string, nullable: true, enum: [alimentacao, lazer] }
        descricao: { type: string, nullable: true }
        curado: { type: boolean }

    ErroResponse:
      type: object
      required:
        - codigo
        - mensagem
      properties:
        codigo:
          type: string
          example: "erro_integracao_google_maps"
        mensagem:
          type: string
          example: "Falha de comunicação com a Places API (Forbidden)"

spring:
  application:
    name: ia-service
  docker:
    compose:
      enabled: false
  jackson:
    # O contrato com o backend-core usa snake_case (curado_por_ia, modelo_utilizado); ver docs/openapi.yml.
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8000

# Configuração própria da cadeia de fallback: ver br.tourapp.iaservice.config.FallbackChainProperties e
# br.tourapp.iaservice.config.LlmProvidersConfig.
#
# As chaves de API NÃO ficam aqui: são lidas diretamente de variável de ambiente
# (ANTHROPIC_API_KEY / GEMINI_API_KEY / OPENAI_API_KEY) dentro de LlmProvidersConfig — ver .env.example.
kyu:
  llm:
    # Limite por tentativa dos provedores comerciais. O Gemini levou até 10,7 s num lote de 10 lugares nas
    # medições (docs/medidas); com 8 s, a cadeia caía no Mistral na maior parte das chamadas.
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:15}
    # Tempo total da cadeia. Fica abaixo dos 40 s que o backend-core espera (IA_SERVICE_TIMEOUT_SECONDS),
    # para a resposta sem curadoria chegar antes de o backend desistir.
    orcamento-total-seconds: ${LLM_ORCAMENTO_TOTAL_SECONDS:35}
    max-tokens: ${LLM_MAX_TOKENS:4096}
    anthropic-model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
    gemini-model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
  seguranca:
    # Segredo compartilhado com o backend-core (X-Kyr-Token). Vazio, o /curar-roteiro aceita qualquer chamada,
    # o que só serve para desenvolvimento local.
    token-do-backend: ${IA_SERVICE_TOKEN:}
